<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FFL Cup 2026 Admin</title><link rel="stylesheet" href="styles.css"></head><body><main class="wrap">
<div class="top"><div class="brand"><h1>FFL Cup Admin</h1><p>Enter final results, goals and assists from the paper scoresheet.</p></div><a class="btn" href="index.html">Public Site</a></div>
<div id="setup" class="notice hidden">Firebase isn't configured yet. Follow README_SETUP.md, then reload this page.</div>
<section id="login" class="card login"><h2>Admin Login</h2><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field" style="margin-top:10px"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><div class="actions"><button class="btn primary" id="loginBtn">Sign in</button></div><p id="loginMsg" class="small muted"></p></section>
<section id="admin" class="hidden"><div class="actions" style="justify-content:space-between"><button class="btn" id="initBtn">Initialize / Reset Tournament</button><button class="btn danger" id="logoutBtn">Sign out</button></div>
<div class="grid" style="margin-top:16px"><div class="card"><h2>Select Match</h2><div class="field"><select id="matchSelect"></select></div><div id="matchMeta" class="small muted" style="margin-top:10px"></div></div><div class="card"><h2>Result</h2><div class="form-grid"><div class="field"><label id="homeLabel">Home</label><input id="homeScore" type="number" min="0" value="0"></div><div class="field"><label id="awayLabel">Away</label><input id="awayScore" type="number" min="0" value="0"></div></div><div id="pens" class="form-grid hidden" style="margin-top:10px"><div class="field"><label>Home penalties</label><input id="homePens" type="number" min="0"></div><div class="field"><label>Away penalties</label><input id="awayPens" type="number" min="0"></div></div></div></div>
<div class="grid" style="margin-top:16px"><div class="card"><h2 id="homePlayersTitle">Home stats</h2><div id="homePlayers"></div></div><div class="card"><h2 id="awayPlayersTitle">Away stats</h2><div id="awayPlayers"></div></div></div>
<div class="actions"><button class="btn primary" id="saveBtn">Save Final Result</button><button class="btn" id="markUpcomingBtn">Mark Upcoming</button></div><p id="saveMsg" class="small muted"></p></section>
</main><script type="module" src="admin.js"></script></body></html>
